name: Pubblica sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica e ottimizza le immagini (solo quelle mancanti)
        run: |
          pip install --quiet pillow
          python scripts/fetch_images.py

      - name: Recensioni (importa, scarica avatar e foto, aggiorna la home)
        run: |
          python scripts/import_reviews.py
          python scripts/fetch_review_media.py
          python scripts/build_reviews.py

      - name: Salva immagini e recensioni nel repository
        run: |
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "Aggiornamento automatico immagini e recensioni"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
